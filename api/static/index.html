<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FastAPI Docs RAG</title><style>
body{margin:0;background:#0b1020;color:#e8edf7;font:16px system-ui,sans-serif}.wrap{max-width:820px;margin:8vh auto;padding:24px}h1{font-size:2.4rem;margin-bottom:8px}.sub{color:#9cabcb}form{display:flex;gap:10px;margin:28px 0}input{flex:1;padding:15px;border-radius:9px;border:1px solid #344264;background:#121a2e;color:inherit;font:inherit}button{padding:0 18px;border:0;border-radius:9px;background:#60a5fa;color:#081326;font-weight:700;cursor:pointer}#answer,#sources{white-space:pre-wrap;line-height:1.6;background:#121a2e;border:1px solid #263452;padding:18px;border-radius:9px;margin-top:16px}.source{font-size:.9rem;color:#b9c7e4;margin:8px 0}small{color:#8ea0c4}</style></head>
<body><main class="wrap"><h1>FastAPI Docs RAG</h1><p class="sub">Hybrid retrieval · cross-encoder reranking · grounded citations</p><form id="form"><input id="q" required minlength="3" placeholder="How do I add a custom exception handler?"><button>Ask</button></form><small id="status"></small><section id="answer" hidden></section><section id="sources" hidden></section></main><script>
const f=document.querySelector('#form'),q=document.querySelector('#q'),a=document.querySelector('#answer'),s=document.querySelector('#sources'),status=document.querySelector('#status');
f.onsubmit=async e=>{e.preventDefault();a.hidden=false;s.hidden=true;a.textContent='';status.textContent='Retrieving and generating…';const r=await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({question:q.value})});const d=await r.json();if(!r.ok){a.textContent=d.detail||'Request failed.';return}a.textContent=d.answer;s.hidden=false;s.innerHTML='<strong>Sources</strong>'+d.sources.map(x=>`<div class="source">[${x.marker}] ${x.header_path} — ${x.source_file}</div>`).join('');status.textContent=`${d.latency_ms} ms${d.cache_hit?' · cached':''}`};
</script></body></html>
