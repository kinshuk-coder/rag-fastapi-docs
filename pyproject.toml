[project]
name = "fastapi-docs-rag"
version = "1.0.0"
description = "Low-memory hybrid RAG assistant for FastAPI documentation."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "chromadb>=1.0,<2.0",
    "fastapi[standard]>=0.115,<1.0",
    "groq>=0.31,<1.0",
    "huggingface-hub>=0.30,<1.0",
    "python-dotenv>=1.0,<2.0",
    "rank-bm25>=0.2.2,<1.0",
]

[dependency-groups]
# Only needed when rebuilding the checked-in Chroma index locally.
indexing = [
    "gitpython>=3.1,<4.0",
    "sentence-transformers>=3.0,<6.0",
]

[tool.fastapi]
entrypoint = "api.main:app"
